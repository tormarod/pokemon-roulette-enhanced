# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Angular Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run test -- --watch=false --browsers=ChromeHeadless
    # The specs mock HttpClient and never bootstrap the app, so they can't see a
    # failure that only exists in the built artifact — 4.0.1 shipped a malformed
    # locale file past a fully green suite and rendered a blank page. This loads
    # the real bundle in a real browser.
    - run: npx playwright install --with-deps chromium
    - run: npm run test:smoke