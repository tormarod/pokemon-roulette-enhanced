<div class="page-shell">
  <app-page-nav active="settings"></app-page-nav>
  <div class="page-title">
    <ng-icon name="bootstrapGear"></ng-icon> {{ 'settings.label' | translate }}
  </div>

  <div class="page-card">
    <div class="page-card-title">{{ 'settings.group.appearance' | translate }}</div>
    <div class="setting-row">
      <app-theme-selector></app-theme-selector>
    </div>
    <div class="setting-row">
      <app-language-selector></app-language-selector>
    </div>
  </div>

  <div class="page-card">
    <div class="page-card-title">{{ 'settings.group.gameplay' | translate }}</div>
    <div class="setting-row">
      <label class="setting-label">{{ 'settings.defaultGender.title' | translate }}</label>
      <div class="setting-options">
        <div class="form-check">
          <input
              class="form-check-input"
              type="radio"
              name="genderOptions"
              [value]="'male'"
              [checked]="(settings$ | async)?.defaultGender === 'male'"
              (change)="onSelectGender('male')"
              id="maleOption">
          <label class="form-check-label" for="maleOption">
            {{ 'settings.defaultGender.male' | translate }}
          </label>
        </div>
        <div class="form-check">
          <input
              class="form-check-input"
              type="radio"
              name="genderOptions"
              [value]="'female'"
              [checked]="(settings$ | async)?.defaultGender === 'female'"
              (change)="onSelectGender('female')"
              id="femaleOption">
          <label class="form-check-label" for="femaleOption">
            {{ 'settings.defaultGender.female' | translate }}
          </label>
        </div>
        <div class="form-check">
          <input
              class="form-check-input"
              type="radio"
              name="genderOptions"
              [value]="'always-choose'"
              [checked]="(settings$ | async)?.defaultGender === 'always-choose'"
              (change)="onSelectGender('always-choose')"
              id="alwaysChooseOption">
          <label class="form-check-label" for="alwaysChooseOption">
            {{ 'settings.defaultGender.always-choose' | translate }}
          </label>
        </div>
      </div>
    </div>
    <div class="setting-row">
      <label class="setting-label" for="explanationsSwitch">
        {{ 'settings.explanations' | translate }}
      </label>
      <input
          class="form-check-input"
          type="checkbox"
          [checked]="$safeNavigationMigration((settings$ | async)?.lessExplanations)"
          (change)="onToggleVerbosity()"
          id="explanationsSwitch">
    </div>
    <div class="setting-row">
      <label class="setting-label" for="skipShinySwitch">
        {{ 'settings.skipShinyRolls' | translate }}
      </label>
      <input
          class="form-check-input"
          type="checkbox"
          [checked]="$safeNavigationMigration((settings$ | async)?.skipShinyRolls)"
          (change)="onToggleSkipShinyRolls()"
          id="skipShinySwitch">
    </div>
    <div class="setting-row">
      <label class="setting-label" for="skipMegaAnimationSwitch">
        {{ 'settings.skipMegaEvolutionAnimation' | translate }}
      </label>
      <input
          class="form-check-input"
          type="checkbox"
          [checked]="$safeNavigationMigration((settings$ | async)?.skipMegaEvolutionAnimation)"
          (change)="onToggleSkipMegaEvolutionAnimation()"
          id="skipMegaAnimationSwitch">
    </div>
    <div class="setting-row">
      <label class="setting-label" for="fastSpinSwitch">
        {{ 'settings.fastSpin' | translate }}
      </label>
      <input
          class="form-check-input"
          type="checkbox"
          [checked]="$safeNavigationMigration((settings$ | async)?.fastSpin)"
          (change)="onToggleFastSpin()"
          id="fastSpinSwitch">
    </div>
  </div>

  <div class="page-card">
    <div class="page-card-title">{{ 'settings.group.audio' | translate }}</div>
    <div class="setting-row">
      <label class="setting-label" for="muteAudioSwitch">
        {{ 'settings.muteAudio' | translate }}
      </label>
      <input
          class="form-check-input"
          type="checkbox"
          [checked]="$safeNavigationMigration((settings$ | async)?.muteAudio)"
          (change)="onToggleMuteAudio()"
          id="muteAudioSwitch">
    </div>
    <div class="setting-row" [class.setting-row-disabled]="$safeNavigationMigration((settings$ | async)?.muteAudio)">
      <label class="setting-label" for="volumeSlider">
        {{ 'settings.volume' | translate }}
      </label>
      <input
          class="form-range w-50"
          type="range"
          min="0"
          max="1"
          step="0.05"
          [value]="$safeNavigationMigration((settings$ | async)?.volume)"
          [disabled]="$safeNavigationMigration((settings$ | async)?.muteAudio)"
          (input)="onVolumeChange($any($event.target).value)"
          id="volumeSlider">
    </div>
  </div>

  <div class="page-card">
    <div class="page-card-title">{{ 'settings.group.data' | translate }}</div>
    <button class="setting-action-button" (click)="openWhatsNew()">
      {{ 'whatsNew.settingsEntry' | translate }}
    </button>
    <div class="setting-danger-row">
      <app-restart-game-button (restartEvent)="onRestartGame()"></app-restart-game-button>
    </div>
  </div>
</div>
